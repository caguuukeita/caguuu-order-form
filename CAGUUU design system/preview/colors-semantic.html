<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:24px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .row{display:flex;gap:12px;width:100%;max-width:660px;flex-wrap:wrap}
  .swatch{flex:1 1 calc(33% - 8px);border-radius:8px;height:120px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid var(--gray-300)}
  .swatch .label{font-family:var(--font-latin);font-weight:700;font-size:13px}
  .swatch .hex{font-family:var(--font-mono);font-size:11px;opacity:.85}
  .role{font-family:var(--font-jp);font-size:11px;opacity:.85;margin-top:4px}
</style></head><body class="ds-preview"><div class="row">
  <div class="swatch" style="background:var(--sale-red);color:#fff"><span class="label">sale-red</span><div><span class="hex">#F52A34</span><div class="role">SALE / price emphasis</div></div></div>
  <div class="swatch" style="background:var(--sale-red-soft);color:var(--sale-red-strong)"><span class="label">sale-red-soft</span><div><span class="hex">#FFEEED</span><div class="role">error bg / tag</div></div></div>
  <div class="swatch" style="background:var(--gold-500);color:#fff"><span class="label">gold-500</span><div><span class="hex">#E5B812</span><div class="role">best-seller fill</div></div></div>
  <div class="swatch" style="background:var(--gold-100);color:var(--gold-700)"><span class="label">gold-100</span><div><span class="hex">#FFFCE6</span><div class="role">best-seller bg</div></div></div>
  <div class="swatch" style="background:var(--warm-cream);color:var(--brand-900)"><span class="label">warm-cream</span><div><span class="hex">#F3EADB</span><div class="role">hero bg</div></div></div>
  <div class="swatch" style="background:var(--success-green);color:#fff"><span class="label">success</span><div><span class="hex">#008A30</span><div class="role">in-stock</div></div></div>
</div></body></html>
