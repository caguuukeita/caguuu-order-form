<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:20px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .row{display:flex;gap:24px;align-items:flex-end;max-width:660px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{background:var(--gray-300);border-radius:3px}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--gray-800)}
</style></head><body class="ds-preview"><div class="row">
  <div class="cell"><div class="box" style="width:4px;height:24px"></div><span class="label">2px</span></div>
  <div class="cell"><div class="box" style="width:8px;height:24px"></div><span class="label">4px</span></div>
  <div class="cell"><div class="box" style="width:16px;height:24px"></div><span class="label">8px</span></div>
  <div class="cell"><div class="box" style="width:24px;height:24px"></div><span class="label">12px</span></div>
  <div class="cell"><div class="box" style="width:32px;height:24px"></div><span class="label">16px</span></div>
  <div class="cell"><div class="box" style="width:40px;height:24px"></div><span class="label">20px</span></div>
  <div class="cell"><div class="box" style="width:48px;height:24px"></div><span class="label">24px</span></div>
  <div class="cell"><div class="box" style="width:64px;height:24px"></div><span class="label">32px</span></div>
  <div class="cell"><div class="box" style="width:80px;height:24px"></div><span class="label">40px</span></div>
</div></body></html>
