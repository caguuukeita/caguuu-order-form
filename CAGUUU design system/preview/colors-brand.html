<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:24px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .row{display:flex;gap:16px;align-items:stretch;width:100%;max-width:660px}
  .swatch{flex:1;border-radius:10px;height:120px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid var(--gray-300)}
  .swatch .label{font-family:var(--font-latin);font-weight:700;font-size:14px}
  .swatch .hex{font-family:var(--font-mono);font-size:11px;opacity:.8}
  .on-dark{color:#fff}.on-light{color:var(--gray-1000)}
</style></head><body class="ds-preview"><div class="row">
  <div class="swatch on-dark" style="background:var(--brand-900)"><span class="label">brand-900</span><span class="hex">#0F3E3A</span></div>
  <div class="swatch on-dark" style="background:var(--brand-800)"><span class="label">brand-800</span><span class="hex">#1B4D48</span></div>
  <div class="swatch on-dark" style="background:var(--brand-700);outline:2px solid var(--brand-700);outline-offset:2px"><span class="label">brand-700 ⭐</span><span class="hex">#1F6862</span></div>
  <div class="swatch on-dark" style="background:var(--brand-500)"><span class="label">brand-500</span><span class="hex">#399E96</span></div>
  <div class="swatch on-light" style="background:var(--brand-200)"><span class="label">brand-200</span><span class="hex">#C0DED8</span></div>
  <div class="swatch on-light" style="background:var(--brand-100)"><span class="label">brand-100</span><span class="hex">#E9F7F7</span></div>
</div></body></html>
