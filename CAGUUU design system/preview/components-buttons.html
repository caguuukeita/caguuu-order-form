<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:24px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:660px}
  .btn{font-family:var(--font-jp);font-weight:600;font-size:14px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:9999px}
  .btn-primary{background:var(--brand-700);color:#fff}
  .btn-primary:hover{background:var(--brand-800)}
  .btn-line{background:#fff;color:var(--brand-700);border:1px solid var(--brand-500);padding:9px 21px}
  .btn-pill{background:var(--brand-700);color:#fff;padding:8px 18px;font-size:13px}
  .btn-sale{background:var(--sale-red);color:#fff}
  .btn-ghost{background:transparent;color:var(--brand-700)}
</style></head><body class="ds-preview"><div class="row">
  <button class="btn btn-primary">カートに入れる</button>
  <button class="btn btn-line">詳細を見る</button>
  <button class="btn btn-sale">SALE 価格で買う</button>
  <button class="btn btn-pill">続きを読む →</button>
  <button class="btn btn-ghost">後で</button>
</div></body></html>
