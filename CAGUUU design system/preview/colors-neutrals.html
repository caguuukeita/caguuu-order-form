<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:24px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .row{display:flex;gap:8px;width:100%;max-width:660px}
  .swatch{flex:1;border-radius:8px;height:110px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:1px solid var(--gray-300)}
  .swatch .label{font-family:var(--font-latin);font-weight:700;font-size:12px}
  .swatch .hex{font-family:var(--font-mono);font-size:10px;opacity:.8}
  .on-dark{color:#fff}.on-light{color:var(--gray-1000)}
</style></head><body class="ds-preview"><div class="row">
  <div class="swatch on-dark" style="background:var(--gray-1000)"><span class="label">gray-1000</span><span class="hex">#232424</span></div>
  <div class="swatch on-dark" style="background:var(--gray-800)"><span class="label">gray-800</span><span class="hex">#5F6060</span></div>
  <div class="swatch on-dark" style="background:var(--gray-700)"><span class="label">gray-700</span><span class="hex">#929494</span></div>
  <div class="swatch on-light" style="background:var(--gray-500)"><span class="label">gray-500</span><span class="hex">#B6B8B7</span></div>
  <div class="swatch on-light" style="background:var(--gray-400)"><span class="label">gray-400</span><span class="hex">#D7D9D9</span></div>
  <div class="swatch on-light" style="background:var(--gray-300)"><span class="label">gray-300</span><span class="hex">#E9EBEB</span></div>
  <div class="swatch on-light" style="background:var(--gray-200)"><span class="label">gray-200</span><span class="hex">#F2F5F5</span></div>
  <div class="swatch on-light" style="background:var(--gray-100)"><span class="label">gray-100</span><span class="hex">#F7FAF9</span></div>
</div></body></html>
