<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:24px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .wrap{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:20px;width:100%;max-width:660px;align-items:center}
  .card{border:1px solid var(--gray-300);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;background:#fff}
  .card.green{background:var(--brand-700);border-color:var(--brand-700)}
  .card img{width:100%;height:auto;display:block}
  .mark{display:flex;align-items:center;gap:14px;padding:14px}
  .mark img{width:56px;height:56px;border-radius:12px;display:block}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--gray-700)}
  .label{position:absolute;top:8px;left:10px;font-family:var(--font-mono);font-size:10px;color:var(--gray-700)}
  .holder{position:relative}
</style></head><body class="ds-preview"><div class="wrap">
  <div class="holder card"><img src="../assets/logo-wordmark-on-white.jpg" alt="CAGUUU wordmark"></div>
  <div class="holder card green"><img src="../assets/logo-wordmark-on-green.jpg" alt="CAGUUU wordmark on green"></div>
  <div class="card" style="grid-column:1 / span 2;justify-content:flex-start"><div class="mark"><img src="../assets/logo-mark.png" alt="CAGUUU mark"><div><div style="font-family:var(--font-latin);font-weight:700;font-size:14px;color:var(--gray-1000)">App icon / favicon</div><div class="meta">1024×1024 source · brand-700 gradient</div></div></div></div>
</div></body></html>
