<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:20px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;gap:18px}
  .field{width:280px}
  .label{font-size:12px;color:var(--gray-800);margin-bottom:6px}
  .input,.select{width:100%;height:40px;border-radius:3px;border:1px solid var(--gray-400);padding:0 12px;font:14px var(--font-jp);background:#fff}
  .input:focus,.select:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 1px var(--brand-500) inset}
  .search{height:40px;border-radius:9999px;background:var(--gray-200);display:flex;align-items:center;padding:0 12px;gap:8px;font:14px var(--font-jp);color:var(--gray-700)}
  .search svg{width:20px;height:20px;color:var(--gray-700)}
</style></head><body class="ds-preview">
  <div class="field"><div class="label">お名前</div><input class="input" value="山田 太郎"></div>
  <div class="field"><div class="label">郵便番号</div><input class="input" placeholder="例: 100-0001"></div>
  <div class="field"><div class="label">検索</div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>キーワードサジェスト</div></div>
</body></html>
