<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:18px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:660px}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;line-height:1.5;border-radius:2px;padding:1px 6px;font-family:var(--font-jp)}
  .tag-sale{background:var(--sale-red);color:#fff;font-weight:700}
  .tag-best{background:var(--gold-100);color:var(--gold-700);padding:0;border-radius:2px;overflow:hidden}
  .tag-best b{background:var(--gold-700);color:#fff;padding:1px 6px;font-weight:700}
  .tag-best i{padding:1px 6px;font-style:normal}
  .tag-new{background:var(--brand-700);color:#fff;font-weight:700}
  .tag-line{background:#fff;border:1px solid var(--sale-red);color:var(--sale-red);font-weight:700}
  .tag-truck{background:var(--brand-100);color:var(--brand-700);font-weight:700}
  .tag-off{background:var(--sale-red-soft);color:var(--sale-red);font-weight:700}
</style></head><body class="ds-preview"><div class="row">
  <span class="tag tag-sale">SALE</span>
  <span class="tag tag-line">特急 →</span>
  <span class="tag tag-best"><b>#1 ベストセラー</b><i>コンパクトソファー</i></span>
  <span class="tag tag-new">NEW</span>
  <span class="tag tag-truck">送料無料</span>
  <span class="tag tag-off">-34% OFF</span>
</div></body></html>
