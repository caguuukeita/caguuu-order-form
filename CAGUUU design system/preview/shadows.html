<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body{margin:0;padding:30px;font-family:var(--font-jp);background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .row{display:flex;gap:24px;max-width:660px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:100px;height:70px;background:#fff;border-radius:10px;border:1px solid var(--gray-300)}
  .label{font-family:var(--font-mono);font-size:11px;color:var(--gray-800);text-align:center}
</style></head><body class="ds-preview"><div class="row">
  <div class="cell"><div class="box"></div><span class="label">shadow-0<br>flat</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-1)"></div><span class="label">shadow-1<br>hover</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-2)"></div><span class="label">shadow-2<br>raised</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-card)"></div><span class="label">card<br>brand-tinted</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-3)"></div><span class="label">shadow-3<br>popover</span></div>
</div></body></html>
